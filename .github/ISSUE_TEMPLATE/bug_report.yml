name: Bug report
description: Something in Zephium is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A precise report is the fastest way to a fix.

        Security problems must not be filed here. Use [private vulnerability reporting](https://github.com/zephium-browser/Zephium/security/advisories/new) instead.

  - type: input
    id: version
    attributes:
      label: Zephium version
      description: Shown in Settings, About.
      placeholder: "1.0.3"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1 / Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, in a sentence or two. Screenshots or a screen recording help.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps, including the page or site involved.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: extensions
    attributes:
      label: Extensions installed
      description: Names and versions, or "none". Say whether the problem still happens with extensions disabled.
      placeholder: "None"

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: |
        In Zephium, open Settings (Cmd+, on macOS, Ctrl+, on Windows), choose About, and click **Copy Diagnostics**. Then paste it here, with no code fence of your own.

        It holds your version, your system and the recent log. Web addresses, searches, page titles, accounts, keys and file locations are removed before it is copied, and **Show What Is Copied** lets you read all of it first. Nothing is sent anywhere, so skim it before you post.

        If Zephium will not start, attach `zephium.log` instead: on Windows from the **Show log folder** button in the startup error (or `%APPDATA%\app.zephium`), on macOS from `~/Library/Logs/app.zephium`. Those files are the raw log and are not redacted, so read them before you attach.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I am on the latest release
          required: false
