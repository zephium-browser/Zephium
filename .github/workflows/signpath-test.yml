name: SignPath test signing

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: signpath-test
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'zephium-browser/Zephium' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SIGNPATH_POLICY: test-signing
      SIGNPATH_CERT_THUMBPRINT: ${{ vars.SIGNPATH_TEST_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require test configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (!$env:SIGNPATH_API_TOKEN) { throw 'Missing SIGNPATH_API_TOKEN secret' }
          if ($env:SIGNPATH_CERT_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') { throw 'Set SIGNPATH_TEST_CERT_THUMBPRINT to the verified public test certificate thumbprint' }
      - name: Verify Windows short-path handling before building
        shell: pwsh
        run: ./scripts/release/signpath.ps1 -Operation TestPaths
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: signpath-test-windows
          # Keep dependency compilation when a later signing/packaging test fails.
          # This cache is scoped separately from production release builds.
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Read version and create notices
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'zephium-desktop').version
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          python scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Notice generation failed' }
      - name: Build unsigned application without signing credentials
        working-directory: desktop
        run: pnpm tauri build --no-bundle -- --locked
      - name: Start packaging with the signing hook
        shell: pwsh
        run: ./scripts/release/signpath.ps1 -Operation Start
      - name: Test-sign packaged browser executable
        uses: ./.github/actions/signpath-sign
        with:
          role: app
          policy: test-signing
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      - name: Test-sign generated uninstaller
        uses: ./.github/actions/signpath-sign
        with:
          role: uninstaller
          policy: test-signing
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      - name: Test-sign final installer
        uses: ./.github/actions/signpath-sign
        with:
          role: installer
          policy: test-signing
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      - name: Verify packaging completed with all signatures
        shell: pwsh
        run: ./scripts/release/signpath.ps1 -Operation Finish
      - name: Test installation, installed signatures, and uninstallation
        shell: pwsh
        run: ./scripts/release/signpath.ps1 -Operation Smoke
      - name: Reject corrupted binaries and unexpected signer or version
        shell: pwsh
        run: ./scripts/release/signpath.ps1 -Operation TestRejection
      - name: Sign final test installer for updater verification
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = "target/release/bundle/nsis/Zephium_$($env:VERSION)_x64-setup.exe"
          cargo run --locked -p xtask -- sign-windows-updater $setup $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Updater signing failed' }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $setup dist/Zephium-Windows-x64-setup.exe
          Copy-Item "$setup.sig" dist/Zephium-Windows-x64-setup.exe.sig
          $config = Get-Content -Raw desktop/tauri.conf.json | ConvertFrom-Json
          [IO.File]::WriteAllBytes("$PWD/dist/updater.pub", [Convert]::FromBase64String($config.plugins.updater.pubkey))
      - name: Save test artifacts only; never publish a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signpath-test-result
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Stop packaging and remove temporary test trust
        if: always()
        shell: pwsh
        run: ./scripts/release/signpath.ps1 -Operation Cleanup

  verify-updater:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signpath-test-result
          path: dist
      - name: Verify updater signature over the Authenticode-signed installer
        working-directory: dist
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          base64 -d Zephium-Windows-x64-setup.exe.sig > installer.minisig
          minisign -V -p updater.pub -m Zephium-Windows-x64-setup.exe -x installer.minisig
          grep -Fx "trusted comment: zephium-updater-v1 version=${VERSION} target=windows-x86_64-nsis" installer.minisig
