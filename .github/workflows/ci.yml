name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A release needs a finished main run for its exact commit, so main runs
  # are never cancelled by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Workflows
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require pinned actions
        run: ruby scripts/ci/check_action_pins.rb
      - name: Test the macOS blocker seed probe policy
        run: bash scripts/ci/test_macos_blocker_seed_probe.sh
      - name: Test which changes need which jobs
        run: bash scripts/ci/test_scope.sh
      - name: actionlint
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  # Decides which jobs a pull request needs: docs and repository metadata
  # need none, frame changes skip Rust unless Rust reads the file, and a CI
  # change runs everything. Main always runs everything: a release needs a
  # full run for its exact commit. Skipped jobs satisfy required checks.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          scope="$(printf 'rust=true\nfrontend=true\nworkflows=true')"
          if [[ "${EVENT}" == "pull_request" ]]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')"
            # The files API stops at 3000 entries; a list that long, or none,
            # cannot prove any job is unaffected.
            count="$(grep -c . <<< "${files}" || true)"
            if (( count > 0 && count < 3000 )); then
              scope="$(scripts/ci/scope.sh <<< "${files}")"
            fi
          fi
          echo "${scope}" >> "${GITHUB_OUTPUT}"
          { echo "Jobs needed:"; echo "${scope}"; } >> "${GITHUB_STEP_SUMMARY}"

  frontend:
    name: Frontend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build tools run while producing signed artifacts, so dev dependencies
      # are in scope.
      - run: node --test scripts/ci/audit-dependencies.test.mjs
      - run: node scripts/ci/audit-dependencies.mjs
      - name: Typecheck, lint and unit tests
        run: pnpm --dir frame run check
      - name: Windows semantic input guards
        run: node scripts/test-semantic-cdp-action.mjs
      - run: pnpm --dir frame run build
      - run: pnpm --dir frame run check:styles

  # Zephium ships on macOS and Windows only, so Linux builds no app code; it
  # runs the platform-neutral policy gates.
  policy:
    name: Rust policy
    needs: changes
    # Runs when the scope check itself failed, so a broken check never skips a job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo fmt --all -- --check
      - name: Security review deadlines (warn only)
        run: |
          cargo xtask check-engine-floors
          cargo xtask check-advisory-exceptions
      # The fork-lock gate inspects the Windows graph offline, so every target's
      # crates must be downloaded first.
      - run: |
          cargo fetch --locked
          for fork in adblock tauri tauri-runtime-wry wry; do
            cargo fetch --locked --manifest-path "vendor/${fork}/Cargo.toml"
          done
      - run: cargo xtask check-security-fork-locks
      - run: cargo xtask check-agentic-probe-boundary
      - run: cargo deny --locked check

  macos:
    name: Rust (macOS)
    needs: changes
    # Runs when the scope check itself failed, so a broken check never skips a job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `--all-targets` lets test-only uses hide dead production code.
      - run: cargo clippy --workspace --lib --locked -- -D warnings
      - name: Vendored updater tests
        run: cargo test -p tauri-plugin-updater --lib --locked
      - run: cargo nextest run --workspace --locked --profile ci --retries 2
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/flaky-summary.py target/nextest/ci/junit.xml
      # The desktop tests regenerate the TypeScript IPC bindings.
      - name: Bindings drift
        run: git diff --exit-code frame/src/shared/ipc/bindings.ts
      # Proves the bundled EasyList/EasyPrivacy seed compiles in the real
      # WKContentRuleListStore, which a seed refresh can break.
      - name: Prove the exact bundled blocker seed compiles in native WKContentRuleListStore
        timeout-minutes: 8
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d)"
          trap 'rm -rf "${probe_root}"' EXIT
          artifact="${probe_root}/webkit-content-rules.json"
          probe="${probe_root}/probe-macos-blocker-seed"
          cargo xtask materialize-blocker-seed-webkit --output "${artifact}"
          xcrun swiftc -parse-as-library -O -warnings-as-errors \
            -module-cache-path "${probe_root}/swift-module-cache" \
            -framework WebKit scripts/ci/probe_macos_blocker_seed.swift -o "${probe}"
          "${probe}" --self-test
          "${probe}" "${artifact}"

  windows:
    name: Rust (Windows)
    needs: changes
    # Runs when the scope check itself failed, so a broken check never skips a job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Vendored updater tests
        run: cargo test -p tauri-plugin-updater --lib --locked
      # The desktop test binary needs the WebView2 loader at run time, which
      # hosted runners lack; the log-policy crate covers its Windows-only code.
      # The native Work storage tests exercise real NTFS handles and process
      # ownership; hosted runners' antivirus makes them flaky. The Work journal
      # tests need a private namespace, which must be owned by the user, and the
      # elevated runner creates directories owned by Administrators. Both run on
      # the Windows QA machine instead.
      - run: >-
          cargo nextest run --workspace --exclude zephium-desktop --locked --profile ci --retries 2 --no-fail-fast
          -E 'not (test(/^platform::windows::native_storage::work::tests::/)
          or (package(zephium-store) and test(/^(hub::agent_work|actor::tests::work_journal_|hub::work_document::runtime_store::tests::approved_deadline_)/)))'
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/ci/flaky-summary.py target/nextest/ci/junit.xml
      - run: cargo test --locked --manifest-path desktop/windows-log-tests/Cargo.toml
