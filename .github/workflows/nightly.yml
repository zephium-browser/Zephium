name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  blocker-fuzz:
    name: Blocker fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `cargo fuzz` runs from the blocker crate; an absolute target dir keeps
      # Cargo from resolving it relative to that nested directory.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/blocker-fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-07-20 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: blocker-fuzz
          workspaces: crates/zephium-blocker/fuzz
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # install-action has no binary for cargo-fuzz 0.13.2; build that exact
      # release from its packaged lockfile.
      - run: cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Audit the fuzz harness graph
        run: >-
          cargo deny --manifest-path crates/zephium-blocker/fuzz/Cargo.toml
          --config crates/zephium-blocker/fuzz/deny.toml --locked check
      - name: Run bounded sanitizer replays
        working-directory: crates/zephium-blocker
        run: |
          set -euo pipefail
          corpus="${RUNNER_TEMP}/blocker-fuzz-corpus"
          artifacts="${RUNNER_TEMP}/blocker-fuzz-artifacts"
          cp -a fuzz/corpus "${corpus}"
          for target in source_admission:131072 request_match:16384 webkit_canonical:131072; do
            name="${target%%:*}"
            mkdir -p "${artifacts}/${name}"
            cargo +nightly-2026-07-20 fuzz run "${name}" "${corpus}/${name}" -- \
              -runs=4096 -seed=20260723 -max_len="${target##*:}" -timeout=10 \
              -rss_limit_mb=4096 -artifact_prefix="${artifacts}/${name}/"
          done
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocker-fuzz-${{ github.run_id }}
          path: ${{ runner.temp }}/blocker-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 7

  blocker-security-fork:
    name: Blocker security fork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: blocker-security-fork
      # The provenance gate resolves every platform graph `--offline`.
      - name: Fetch the locked blocker graphs
        run: |
          set -euo pipefail
          cargo fetch --locked
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            cargo fetch --locked --target "${target}"
          done
          cargo fetch --locked --manifest-path vendor/adblock/Cargo.toml
      - run: cargo xtask check-blocker-security-fork

  extended:
    name: Extended (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: extended
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.137
          fallback: none

      - name: Vendored native adapters
        shell: bash
        run: |
          set -euo pipefail
          for adapter in \
            "vendor/wry/Cargo.toml:" \
            "vendor/tauri-runtime-wry/Cargo.toml:macos-private-api" \
            "vendor/tauri/Cargo.toml:macos-private-api,specta"
          do
            manifest="${adapter%%:*}"
            features="${adapter#*:}"
            cargo fmt --manifest-path "${manifest}" -- --check
            cargo clippy --manifest-path "${manifest}" --locked --all-targets ${features:+--features "${features}"} -- -D warnings
            cargo clippy --manifest-path "${manifest}" --locked --lib ${features:+--features "${features}"} -- -D warnings
            cargo test --manifest-path "${manifest}" --locked --all-targets ${features:+--features "${features}"}
          done

      - name: Agentic probe harness
        if: runner.os == 'macOS'
        run: |
          cargo test --locked -p zephium-agentic --features probe-harness
          cargo clippy --locked -p zephium-agentic --all-targets --features probe-harness -- -D warnings

      - name: macOS native probe graphs
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          cargo clippy --locked -p zephium-engine --features native-isolation-probes \
            --bin macos-principal-isolation-probe -- -D warnings
          cargo clippy --locked -p zephium-engine --features native-agentic-input-probe \
            --bin macos-agentic-input-probe -- -D warnings
          cargo run --locked -p zephium-engine --features native-agentic-input-probe \
            --bin macos-agentic-input-probe -- --ci-hidden-fixed-dom

      - name: Windows feature graphs
        if: runner.os == 'Windows'
        run: |
          cargo clippy --locked -p zephium-engine --lib --features windows-cdp-spike -- -D warnings
          cargo clippy --locked -p zephium-private-fs --all-targets --features windows-namespace-validation -- -D warnings
          cargo nextest run --locked -p zephium-app --features work-runtime,work-execution
          cargo nextest run --locked -p zephium-agentic --features provider-transport,probe-harness
          cargo nextest run --locked -p zephium-work-composition --features durable-runtime
          cargo clippy --locked -p zephium-terra-macos-probe --features durable-runtime --bin windows-work-probe -- -D warnings
          cargo build --locked -p zephium-terra-macos-probe --features durable-runtime --bin windows-work-probe

      # `cargo xtask check-agentic-probe-boundary` requires these two steps.
      - name: Parse the Windows agentic qualification workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts\qualification\windows-agentic.ps1"
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw "physical Windows agentic orchestrator did not parse"
          }

      - name: Audit and build the Windows agentic qualification runners
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo clippy --locked -p zephium-engine \
            --features native-agentic-input-probe \
            --bin windows-agentic-input-probe
          cargo build --locked -p zephium-engine \
            --features native-agentic-input-probe \
            --bin windows-agentic-input-probe
          cargo clippy --locked -p zephium-engine \
            --features native-agentic-semantic-probe \
            --bin windows-agentic-semantic-probe
          cargo build --locked -p zephium-engine \
            --features native-agentic-semantic-probe \
            --bin windows-agentic-semantic-probe

  coverage:
    name: Coverage
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.8.6,cargo-nextest@0.9.137
          fallback: none
      - run: cargo llvm-cov nextest --locked --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-report
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
