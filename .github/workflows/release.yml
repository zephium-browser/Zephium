name: Prepare existing v1.0.4 draft

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-v1.0.4
  cancel-in-progress: false

jobs:
  draft:
    name: Verify existing artifacts and prepare draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
      - name: Verify the existing release and prepare manifests
        run: python3 scripts/release/recover_draft.py
      - name: Attest artifact recovery without claiming a new build
        id: recovery
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Zephium-macOS-arm64.dmg
            dist/Zephium-macOS-arm64.app.tar.gz
            dist/Zephium-Windows-x64-setup.exe
          predicate-type: https://github.com/zephium-browser/Zephium/attestations/release-recovery/v1
          predicate-path: dist/release-recovery.json
      - name: Verify recovery attestation
        run: |
          for asset in dist/Zephium-macOS-arm64.dmg dist/Zephium-macOS-arm64.app.tar.gz dist/Zephium-Windows-x64-setup.exe; do
            gh attestation verify "$asset" --repo zephium-browser/Zephium \
              --signer-workflow zephium-browser/Zephium/.github/workflows/release.yml \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type https://github.com/zephium-browser/Zephium/attestations/release-recovery/v1
          done
      - name: Create draft for owner testing
        env:
          RECOVERY_BUNDLE: ${{ steps.recovery.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 -c 'from scripts.release.recover_draft import check_tag; check_tag()'
          cp "${RECOVERY_BUNDLE}" dist/release-recovery.sigstore.json
          cat > "${RUNNER_TEMP}/notes.md" <<'NOTES'
          Zephium 1.0.4 — awaiting owner testing on macOS and Windows.

          These are the unchanged artifacts from [release build 40728542253](https://github.com/zephium-browser/Zephium/actions/runs/40728542253), source commit `1a4c039b7de4c61bc7905bffbf8859d6b5361fab`. Both platform builds and main CI passed. macOS signing and notarization passed in the original build; both updater signatures and the original artifact digests were verified again during draft preparation.

          - macOS (Apple Silicon): `Zephium-macOS-arm64.dmg`
          - Windows (x64): `Zephium-Windows-x64-setup.exe`

          The Windows installer is unsigned while the production SignPath certificate is pending. SmartScreen may ask for confirmation.

          **Component validation exception:** the complete component gate was waived for this draft at the owner's request after GitHub failed to allocate a macOS runner. The exact shard statuses are recorded in `release-recovery.json`; this does not claim that every component test passed.

          `SHA256SUMS` covers the application assets and recovery manifest. The attached recovery attestation binds the original build, artifact digests and source commit; it records artifact recovery, not a new compilation. Verify an asset with:

          ```sh
          gh attestation verify <asset> --repo zephium-browser/Zephium --predicate-type https://github.com/zephium-browser/Zephium/attestations/release-recovery/v1
          ```

          This release is a draft. Publishing remains the owner's decision after testing.
          NOTES
          gh release create v1.0.4 dist/* --repo zephium-browser/Zephium \
            --draft --verify-tag --title 'Zephium 1.0.4' --notes-file "${RUNNER_TEMP}/notes.md"
