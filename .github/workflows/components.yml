name: Components

# Mounts the real UI in headless WebKit. It is heavy, so it runs when asked:
# the `full-ui-tests` label on a pull request, a manual run, or as part of
# every release.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: components-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  components:
    name: Frontend components (WebKit ${{ matrix.shard }}/8)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ui-tests') }}
    runs-on: macos-15
    timeout-minutes: 40
    # Bound each headless WebKit worker to roughly thirty real UI files.
    # Longer batches can stop progressing late in the run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frame run i18n
      - run: pnpm --dir frame exec playwright install webkit
      - run: pnpm --dir frame run test:component --retry=1 --shard=${{ matrix.shard }}/8
