[workspace]
resolver = "2"
members = ["crates/*", "desktop", "xtask"]
exclude = [
    "vendor/adblock",
    "vendor/tauri",
    "vendor/tauri-runtime-wry",
    "vendor/wry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["crynta"]
repository = "https://github.com/zephium/zephium"

[workspace.dependencies]
zephium-blocker = { path = "crates/zephium-blocker", version = "=0.1.0", default-features = false }
zephium-blocker-service = { path = "crates/zephium-blocker-service", version = "=0.1.0" }
zephium-blocker-update = { path = "crates/zephium-blocker-update", version = "=0.1.0" }
zephium-core = { path = "crates/zephium-core", version = "=0.1.0" }
zephium-ipc = { path = "crates/zephium-ipc", version = "=0.1.0" }
zephium-engine = { path = "crates/zephium-engine", version = "=0.1.0" }
zephium-store = { path = "crates/zephium-store", version = "=0.1.0" }
zephium-app = { path = "crates/zephium-app", version = "=0.1.0" }

tauri = { version = "=2.11.3", features = ["macos-private-api"] }
tauri-build = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
wry = "=0.55.1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
ulid = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
proptest = "1"
tempfile = "3"
tough = { version = "=0.24.0", default-features = false }

# These native-boundary crates start from the exact upstream revisions recorded
# alongside their source. Keeping the surgical adapters in-tree makes Tauri
# construction policy and Wry's callback, prompt, teardown, profile, and Linux
# process-isolation policy reproducible without relying on mutable forks.
[patch.crates-io]
adblock = { path = "vendor/adblock" }
tauri = { path = "vendor/tauri" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
wry = { path = "vendor/wry" }

[profile.release]
# Browser chrome should fail terminally on an invariant violation instead of
# attempting to unwind through native WebView/Objective-C/COM callbacks.
panic = "abort"
# Keep the native shell small without giving up whole-program optimization.
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
# Bounds checks remain enabled independently; retain integer overflow checks
# as well so release builds do not silently wrap security/resource counters.
overflow-checks = true
