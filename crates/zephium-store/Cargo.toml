[package]
name = "zephium-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
work-execution = ["dep:zephium-private-fs"]
# Explicit non-shipping OS fixture campaign; private-fs rejects release builds.
windows-namespace-validation = ["work-execution", "zephium-private-fs/windows-namespace-validation"]

[dependencies]
zephium-agentic.workspace = true
zephium-core.workspace = true
zephium-private-fs = { workspace = true, optional = true }
rusqlite.workspace = true
serde.workspace = true
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
url.workspace = true
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
zephium-private-fs = { workspace = true, features = ["windows-work-test-fixtures"] }
