[package]
name = "zephium-agentic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Fixed-endpoint provider I/O is opt-in. Keeping these dependencies optional
# preserves the zero-runtime-authority functional core in the default graph.
provider-transport = [
    "dep:futures-util",
    "dep:reqwest",
    "dep:rig-core",
    "dep:tokio",
    "dep:zeroize",
    "dep:security-framework",
    "dep:security-framework-sys",
    "dep:dirs",
    "dep:zephium-decision",
    "dep:httpdate",
    "dep:zephium-credentials",
]
# Fixed loopback fixtures and native-probe support are diagnostic code. The
# crate-level optimized-build refusal makes this feature mechanically
# unavailable to every release graph, even if a downstream manifest enables it.
probe-harness = ["zephium-decision?/evals"]

[[bin]]
name = "windows-agentic-input-evidence-review"
path = "src/bin/windows_agentic_input_evidence_review.rs"
required-features = ["probe-harness"]

[[bin]]
name = "windows-agentic-semantic-evidence-review"
path = "src/bin/windows_agentic_semantic_evidence_review.rs"
required-features = ["probe-harness"]

[dependencies]
base64.workspace = true
crc32fast.workspace = true
psl = "=2.1.238"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"], optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "stream", "system-proxy"], optional = true }
rig-core = { version = "=0.42.0", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"], optional = true }
ulid.workspace = true
url.workspace = true
zeroize = { version = "=1.9.0", optional = true }
zephium-decision = { workspace = true, optional = true }
httpdate = { version = "=1.0.3", optional = true }
zephium-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
zephium-credentials = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }
dirs = { version = "=6.0.0", optional = true }

[dev-dependencies]
proptest.workspace = true
