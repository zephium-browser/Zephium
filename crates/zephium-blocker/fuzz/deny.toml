[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    # ring and untrusted, for the hardware SHA-256 the cache uses.
    "ISC",
    "MIT",
    "MPL-2.0",
    # Test-only `libfuzzer-sys`; this graph is excluded from product binaries.
    "NCSA",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
