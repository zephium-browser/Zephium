[package]
name = "zephium-blocker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["runtime", "runtime-exact", "webkit"]
runtime = []
runtime-exact = ["runtime", "adblock/embedded-domain-resolver"]
webkit = ["adblock/content-blocking"]
# Protection QA builds only: one `.test` host per blocked-page reason, which
# never resolves, so the page can be shown without loading a real site.
qa-test-hosts = []

[dependencies]
zephium-core.workspace = true
adblock = { version = "=0.13.2", default-features = false, features = ["full-regex-handling", "css-validation", "embedded-domain-resolver"] }
idna = "=1.1.0"
serde.workspace = true
serde_json.workspace = true
url.workspace = true
ring.workspace = true
thiserror.workspace = true
regex = "=1.12.4"
base64.workspace = true

[dev-dependencies]
flate2 = "=1.1.9"
proptest.workspace = true
# The desktop graph enables dfa-build through bstr; tests and labs build the
# regex engine the app ships.
regex-automata = { version = "=0.4.18", features = ["dfa-build"] }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
