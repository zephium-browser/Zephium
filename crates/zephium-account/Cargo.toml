[package]
name = "zephium-account"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
zeroize = "=1.9.1"
zephium-credentials.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
