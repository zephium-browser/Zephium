[package]
name = "zephium-private-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Non-shipping gate for the live Windows adapter validation campaign.
windows-namespace-validation = []
# Closed QA-session ownership/retirement for Windows test dependencies only.
windows-work-test-fixtures = []

[dependencies]
thiserror.workspace = true
unicode-normalization = "=0.1.25"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
