[package]
name = "zephium-public-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
brotli-decompressor = { version = "=5.0.3", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
psl = "=2.1.220"
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls"] }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tower-layer = "=0.3.3"
tower-service = "=0.3.3"
url.workspace = true
zephium-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "=0.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
brotli = { version = "=8.0.4", default-features = false, features = ["std"] }
proptest.workspace = true
