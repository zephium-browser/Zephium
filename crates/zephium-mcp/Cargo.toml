[package]
name = "zephium-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Streamable HTTP servers, with OAuth sign-in.
http = ["rmcp/transport-streamable-http-client-reqwest", "rmcp/auth", "dep:reqwest", "dep:url", "dep:async-trait"]
# Connection secrets in the login Keychain.
keychain = ["http", "dep:security-framework", "dep:security-framework-sys", "dep:zephium-credentials", "dep:zeroize", "dep:sha2", "dep:ulid"]
# The `zephium-mcp-fixture` stdio server that tests connect to.
fixture = ["rmcp/server", "rmcp/transport-io"]

[[bin]]
name = "zephium-mcp-fixture"
path = "src/bin/fixture.rs"
required-features = ["fixture"]

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-async-rw"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "net"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "system-proxy"], optional = true }
url = { workspace = true, optional = true }
libc = "=0.2.189"
async-trait = { version = "=0.1.92", optional = true }
zeroize = { version = "=1.9.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }
ulid = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
zephium-credentials = { workspace = true, optional = true }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }

[dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "server", "transport-async-rw", "transport-io"] }
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "net", "rt-multi-thread", "macros", "io-std"] }

[[test]]
name = "stdio"
required-features = ["fixture"]

[[test]]
name = "http"
required-features = ["http"]
