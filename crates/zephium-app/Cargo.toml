[package]
name = "zephium-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Dormant composition seam for the production agent browser runtime. The
# ordinary desktop graph does not enable it until a concrete lifecycle owner
# and its full platform qualification are integrated.
work-planning = ["dep:tokio", "dep:zephium-agentic", "zephium-agentic/provider-transport", "dep:lopdf"]
work-runtime = ["work-planning", "dep:sha2", "dep:regex", "dep:globset", "dep:libc", "dep:ignore", "dep:grep-searcher", "dep:grep-regex", "dep:grep-matcher", "dep:similar", "dep:zephium-mcp"]
# Explicit public synthesis diagnostics; agentic refuses probe-harness in optimized builds.
work-synthesis-probe = ["work-runtime", "zephium-agentic/probe-harness"]
agentic-browser = ["dep:zephium-agentic"]
work-execution = ["agentic-browser", "dep:zephium-agent-controller", "dep:zephium-agent-runtime", "dep:zephium-agent-provider-transport"]
# Explicit public-data qualification only; dependencies independently refuse release.
work-execution-probe = ["work-execution", "zephium-agent-controller/probe-harness"]
# Browser-owned camera/microphone prompts for foreground macOS tabs.
macos-page-permission-prompts = []

[dependencies]
serde_json.workspace = true
psl = "=2.1.238"
sha2 = { version = "=0.10.9", optional = true }
tokio = { workspace = true, optional = true, features = ["time", "process", "io-util"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
zephium-agentic = { workspace = true, optional = true }
zephium-agent-controller = { workspace = true, optional = true, features = ["provider-transport"] }
zephium-agent-runtime = { workspace = true, optional = true }
zephium-agent-provider-transport = { workspace = true, optional = true }
zephium-core.workspace = true
zephium-ipc.workspace = true
base64.workspace = true
url.workspace = true

regex = { version = "=1.13.1", optional = true }
globset = { version = "=0.4.20", optional = true }
ignore = { version = "=0.4.33", optional = true }
grep-searcher = { version = "=0.1.17", optional = true }
grep-regex = { version = "=0.1.14", optional = true }
grep-matcher = { version = "=0.1.9", optional = true }
similar = { version = "=3.2.0", optional = true }
zephium-mcp = { path = "../zephium-mcp", version = "=0.1.0", features = ["keychain"], optional = true }
lopdf = { version = "=0.45.0", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.189", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security"] }

[dev-dependencies]
zephium-agent-model-catalog.workspace = true
serde_json.workspace = true
zephium-store = { workspace = true, features = ["work-execution"] }
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
zephium-private-fs = { workspace = true, features = ["windows-work-test-fixtures"] }
