[package]
name = "zephium-blocker-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tuf = [
    "dep:async-trait",
    "dep:futures-util",
    "dep:reqwest",
    "dep:rustix",
    "dep:tokio",
    "dep:tough",
    "dep:windows",
]

[dependencies]
async-trait = { version = "=0.1.89", optional = true }
futures-util = { version = "=0.3.32", default-features = false, features = ["std"], optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream", "system-proxy"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time"], optional = true }
tough = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
aws-lc-rs = "=1.17.3"
jiff = "0.2"
tempfile.workspace = true
zephium-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
zephium-blocker = { workspace = true, features = ["runtime"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"], optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
zephium-blocker = { workspace = true, features = ["webkit"] }
