[package]
name = "zephium-update-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tough = ["dep:async-trait", "dep:tough"]

[dependencies]
async-trait = { version = "=0.1.92", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy"] }
thiserror.workspace = true
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
tough = { workspace = true, optional = true }
url.workspace = true
